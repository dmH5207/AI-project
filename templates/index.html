<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI智能测评系统 - 登录</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/pages/login.css">
</head>
<body class="login-body">

  <div class="login-wrapper">

    <div class="login-card">
      <div class="login-header">
        <h1 data-i18n="sysTitle">AI智能测评系统</h1>
        <p class="login-subtitle" data-i18n="subtitle">全面评估你的AI素养能力</p>
      </div>

      <div id="loginSection">
        <form id="loginForm" class="login-form">
          <input type="hidden" id="loginRole" value="phone">

          <div class="form-group">
            <label for="phone" data-i18n="phone">手机号</label>
            <div class="input-wrapper">
              <input type="tel" id="phone" name="phone" data-i18n-placeholder="phonePh" placeholder="请输入手机号" maxlength="11" required>
            </div>
            <p class="field-hint" id="phoneHint" data-i18n="phoneHint">请输入中国大陆11位手机号码</p>
          </div>

          <div class="form-group">
            <label for="password" data-i18n="password">密码</label>
            <div class="input-wrapper">
              <input type="password" id="password" name="password" data-i18n-placeholder="passwordPh" placeholder="请输入密码" autocomplete="current-password" required>
              <button type="button" class="toggle-password" id="togglePassword" aria-label="显示密码">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/>
                  <path d="M3 3l18 18"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label for="loginRoleSelect" data-i18n="role">身份</label>
            <select id="loginRoleSelect" class="role-select">
              <option value="student" data-i18n="student">学生</option>
              <option value="admin" data-i18n="admin">管理员</option>
            </select>
          </div>

          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox" id="rememberMe"> <span data-i18n="rememberMe">记住我</span>
            </label>
            <a href="#" class="forgot-password" id="forgotPasswordLink" data-i18n="forgotPwd">忘记密码？</a>
          </div>

          <button type="submit" class="login-btn" id="loginBtn" data-i18n="loginBtn">登 录</button>

          <div class="login-message" id="loginMessage"></div>
        </form>

        <div class="switch-link">
          <span data-i18n="noAccount">没有账号？</span><a href="#" id="toRegister" data-i18n="registerNow">立即注册</a>
        </div>
      </div>

      <div id="registerSection" style="display:none;">
        <form id="registerForm" class="login-form">
          <div class="form-group">
            <label for="regUsername" data-i18n="username">账号</label>
            <div class="input-wrapper">
              <input type="text" id="regUsername" name="regUsername" data-i18n-placeholder="setAccount" placeholder="请设置账号" required>
            </div>
          </div>

          <div class="form-group">
            <label for="regPhone" data-i18n="phone">手机号</label>
            <div class="input-wrapper">
              <input type="tel" id="regPhone" name="regPhone" data-i18n-placeholder="phonePh" placeholder="请输入手机号" maxlength="11" required>
            </div>
            <p class="field-hint" id="regPhoneHint" data-i18n="phoneHint">请输入中国大陆11位手机号码</p>
          </div>

          <div class="form-group">
            <label for="regPassword" data-i18n="password">密码</label>
            <div class="input-wrapper">
              <input type="password" id="regPassword" name="regPassword" data-i18n-placeholder="setPassword" placeholder="请设置密码（至少6位）" required>
            </div>
          </div>

          <div class="form-group">
            <label for="regConfirm" data-i18n="confirmPwd">确认密码</label>
            <div class="input-wrapper">
              <input type="password" id="regConfirm" name="regConfirm" data-i18n-placeholder="confirmPwdPh" placeholder="请再次输入密码" required>
            </div>
          </div>

          <div class="form-group">
            <label for="regRole" data-i18n="role">身份</label>
            <select id="regRole" class="role-select">
              <option value="student" data-i18n="student">学生</option>
              <option value="admin" data-i18n="admin">管理员</option>
            </select>
          </div>

          <button type="submit" class="login-btn" id="registerBtn" data-i18n="registerBtn">注 册</button>

          <div class="login-message" id="registerMessage"></div>
        </form>

        <div class="switch-link">
          <span data-i18n="hasAccount">已有账号？</span><a href="#" id="toLogin" data-i18n="backToLogin">返回登录</a>
        </div>
      </div>
    </div>

  </div>

  <div class="modal-overlay" id="forgotModal">
    <div class="modal-card">
      <h2 data-i18n="forgotTitle">忘记密码</h2>
      <p data-i18n="forgotDesc">请输入你的账号，管理员将帮你重置密码。</p>
      <div class="form-group">
        <input type="text" id="forgotUsername" data-i18n-placeholder="forgotPh" placeholder="请输入你的账号">
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" id="forgotCancel" data-i18n="cancel">取消</button>
        <button class="btn-confirm" id="forgotConfirm" data-i18n="submitBtn">提交</button>
      </div>
      <div class="forgot-message" id="forgotMessage"></div>
    </div>
  </div>

  <script src="/static/i18n.js"></script>
  <script src="/static/login.js"></script>
</body>
</html>

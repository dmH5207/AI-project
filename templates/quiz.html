<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI智能测评系统 - 答题</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/pages/quiz.css">
</head>
<body class="app-body">

  <header class="app-header">
    <h1 class="app-title">答题</h1>
    <p class="app-greeting" id="greeting">选择一种练习模式开始</p>
  </header>

  <main class="app-main">

    <section id="modeArea">
      <div class="mode-grid" id="modeGrid">
        <!-- 三张卡片由 JS 渲染 -->
      </div>
    </section>

    <section id="quizArea" style="display:none;">
      <div class="quiz-progress">
        <span id="progressText">第 1 / 10 题</span>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill" style="width: 10%;"></div>
        </div>
      </div>

      <div class="quiz-card">
        <p class="dimension-label" id="dimensionLabel">维度：—</p>
        <h2 class="question-text" id="questionText">题目加载中...</h2>
        <div class="options" id="optionsBox"></div>
      </div>

      <button class="next-btn" id="nextBtn" disabled>下一题</button>
    </section>

    <section id="resultArea" style="display:none;">
      <div class="result-card">
        <h2>本次答题完成</h2>
        <div class="result-score">
          <span class="score-num" id="scoreNum">0</span>
          <span class="score-unit">分</span>
        </div>
        <p class="result-detail" id="resultDetail">共 0 题，答对 0 题</p>
        <div class="result-actions">
          <button class="result-btn primary" id="toWrongBtn">查看错题</button>
          <button class="result-btn" id="restartBtn">再来一次</button>
        </div>
      </div>
    </section>

  </main>

  <nav class="tabbar">
    <a href="/quiz" class="tabbar-item active">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 6h16M4 12h16M4 18h10"/>
      </svg>
      <span>答题</span>
    </a>
    <a href="/wrong" class="tabbar-item">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 8v5M12 16h.01"/>
        <circle cx="12" cy="12" r="9"/>
      </svg>
      <span>错题</span>
    </a>
    <a href="/me" class="tabbar-item">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 21c0-4 4-7 8-7s8 3 8 7"/>
      </svg>
      <span>我的</span>
    </a>
  </nav>

  <script src="/static/quiz.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI智能测评系统 - 答题</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/pages/quiz.css">
</head>
<body class="app-body">

  <header class="app-header">
    <h1 class="app-title" data-i18n="quizTitle">答题</h1>
    <p class="app-greeting" id="greeting" data-i18n="quizGreeting">选择一种练习模式开始</p>
  </header>

  <main class="app-main">

    <section id="modeArea">
      <div class="mode-grid" id="modeGrid">
        <!-- 三张卡片由 JS 渲染 -->
      </div>
    </section>

    <section id="quizArea" style="display:none;">
      <div class="quiz-progress">
        <span id="progressText" data-i18n="progress">第 1 / 10 题</span>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill" style="width: 10%;"></div>
        </div>
      </div>

      <div class="quiz-card">
        <p class="dimension-label" id="dimensionLabel">—</p>
        <h2 class="question-text" id="questionText" data-i18n="loading">题目加载中...</h2>
        <div class="options" id="optionsBox"></div>
      </div>

      <button class="next-btn" id="nextBtn" disabled data-i18n="nextQ">下一题</button>
    </section>

    <section id="resultArea" style="display:none;">
      <div class="result-card">
        <h2 data-i18n="quizDone">本次答题完成</h2>
        <div class="result-score">
          <span class="score-num" id="scoreNum">0</span>
          <span class="score-unit" data-i18n="score">分</span>
        </div>
        <p class="result-detail" id="resultDetail">共 0 题，答对 0 题</p>
        <div class="result-actions">
          <button class="result-btn primary" id="toWrongBtn" data-i18n="viewWrong">查看错题</button>
          <button class="result-btn" id="restartBtn" data-i18n="tryAgain">再来一次</button>
        </div>
      </div>
    </section>

  </main>

  <nav class="tabbar">
    <a href="/quiz" class="tabbar-item active">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 6h16M4 12h16M4 18h10"/>
      </svg>
      <span data-i18n="tabQuiz">答题</span>
    </a>
    <a href="/wrong" class="tabbar-item">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 8v5M12 16h.01"/>
        <circle cx="12" cy="12" r="9"/>
      </svg>
      <span data-i18n="tabWrong">错题</span>
    </a>
    <a href="/admin" class="tabbar-item">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/>
      </svg>
      <span data-i18n="tabAdmin">管理</span>
    </a>
    <a href="/me" class="tabbar-item">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 21c0-4 4-7 8-7s8 3 8 7"/>
      </svg>
      <span data-i18n="tabMe">我的</span>
    </a>
  </nav>

  <script src="/static/i18n.js"></script>
  <script src="/static/quiz.js"></script>
</body>
</html>

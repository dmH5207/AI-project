<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI智能测评系统 - 对话式练习</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/pages/dialog.css">
</head>
<body class="dialog-body">

  <header class="dialog-header">
    <a href="/quiz" class="back-btn" aria-label="返回">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </a>
    <div class="header-center">
      <h1 class="dialog-title">对话式练习</h1>
      <p class="dialog-progress" id="progressText">第 1 / 6 轮 · AI基础认知</p>
    </div>
    <div class="header-right"></div>
  </header>

  <main class="chat-area" id="chatArea"></main>

  <footer class="input-area" id="inputArea">
    <div class="input-row">
      <textarea id="answerInput" class="answer-input" rows="1" placeholder="输入你的回答..."></textarea>
      <button class="send-btn" id="sendBtn" disabled aria-label="发送">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 2L11 13"/>
          <path d="M22 2l-7 20-4-9-9-4 20-7z"/>
        </svg>
      </button>
    </div>
    <p class="input-hint" id="inputHint"></p>
  </footer>

  <div class="report-overlay" id="reportOverlay">
    <div class="report-card">
      <h2>练习完成</h2>
      <p class="report-sub">你已完成 6 轮对话式练习</p>

      <div class="report-section">
        <h3>总评</h3>
        <p id="reportComment"></p>
      </div>

      <div class="report-section">
        <h3>亮点</h3>
        <ul id="reportHighlights"></ul>
      </div>

      <div class="report-section">
        <h3>改进建议</h3>
        <ul id="reportSuggestions"></ul>
      </div>

      <div class="report-section">
        <h3>分数表</h3>
        <div id="reportScoreTable" class="score-table"></div>
      </div>

      <div class="report-section">
        <h3>能力雷达图</h3>
        <div id="reportRadar" class="radar-box"></div>
      </div>

      <div class="report-actions">
        <button class="report-btn primary" id="backToModesBtn">返回模式选择</button>
        <button class="report-btn" id="retryBtn">再来一次</button>
      </div>
    </div>
  </div>

  <script src="/static/dialog.js"></script>
</body>
</html>

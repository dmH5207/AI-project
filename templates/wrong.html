<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI智能测评系统 - 错题中心</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/pages/wrong.css">
</head>
<body class="app-body">

  <header class="app-header">
    <h1 class="app-title" data-i18n="wrongTitle">错题中心</h1>
    <p class="app-greeting" id="greeting" data-i18n="wrongGreeting">温故而知新，可以为师矣</p>
  </header>

  <main class="app-main">

    <section id="emptyState" style="display:none;">
      <div class="empty-card">
        <svg class="empty-icon" viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M9 12h6M12 9v6"/>
        </svg>
        <h2 data-i18n="noWrong">暂无错题</h2>
        <p data-i18n="keepGoing">继续保持，你是最棒的！</p>
        <a href="/quiz" class="goto-quiz-btn" data-i18n="goQuiz">去答题</a>
      </div>
    </section>

    <section id="wrongList">
      <div class="loading-card">
        <div class="loading-spinner"></div>
        <p data-i18n="loadingWrong">正在加载错题列表...</p>
      </div>
    </section>

  </main>

  <nav class="tabbar">
    <a href="/quiz" class="tabbar-item">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 6h16M4 12h16M4 18h10"/>
      </svg>
      <span data-i18n="tabQuiz">答题</span>
    </a>
    <a href="/wrong" class="tabbar-item active">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 8v5M12 16h.01"/>
        <circle cx="12" cy="12" r="9"/>
      </svg>
      <span data-i18n="tabWrong">错题</span>
    </a>
    <a href="/me" class="tabbar-item">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 21c0-4 4-7 8-7s8 3 8 7"/>
      </svg>
      <span data-i18n="tabMe">我的</span>
    </a>
  </nav>

  <script src="/static/i18n.js"></script>
  <script src="/static/wrong.js"></script>
</body>
</html>

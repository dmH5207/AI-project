<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI智能测评系统 - 我的</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/pages/me.css">
</head>
<body class="app-body">

  <header class="app-header">
    <h1 class="app-title" data-i18n="title">我的</h1>
    <div class="lang-switch" id="langSwitch">
      <span class="lang-label" data-lang="zh">中</span>
      <div class="lang-toggle" id="langToggle">
        <div class="lang-knob" id="langKnob"></div>
      </div>
      <span class="lang-label" data-lang="en">EN</span>
    </div>
  </header>

  <main class="app-main">

    <div class="profile-card">
      <div class="avatar-box" id="avatarBox">
        <img src="/static/avatar.png" alt="头像" class="avatar-img" id="avatarImg">
        <div class="avatar-overlay" id="avatarOverlay">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
        </div>
        <input type="file" id="avatarInput" accept="image/png,image/jpeg,image/gif,image/webp" style="display:none">
      </div>
      <div class="profile-info">
        <h2 class="profile-name" id="profileName">--</h2>
        <p class="profile-role" id="profileRole">--</p>
      </div>
    </div>

    <div class="info-card">
      <div class="info-row">
        <span class="info-label" data-i18n="phone">手机号</span>
        <span class="info-value" id="profilePhone">--</span>
      </div>
      <div class="info-row">
        <span class="info-label" data-i18n="role">身份</span>
        <span class="info-value" id="profileRoleText">--</span>
      </div>
    </div>

    <div class="menu-card">
      <button class="menu-item" id="changePwdBtn">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2"/>
          <path d="M7 11V7a5 5 0 0110 0v4"/>
        </svg>
        <span data-i18n="changePwd">修改密码</span>
        <svg class="menu-arrow" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18l6-6-6-6"/>
        </svg>
      </button>
      <button class="menu-item" id="switchLoginBtn">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 3h5v5M4 20L21 3M21 16v5h-5M3 4l17 17"/>
        </svg>
        <span data-i18n="switchLogin">切换登录</span>
        <svg class="menu-arrow" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18l6-6-6-6"/>
        </svg>
      </button>
      <button class="menu-item danger" id="logoutBtn">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>
        </svg>
        <span data-i18n="logout">退出登录</span>
        <svg class="menu-arrow" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18l6-6-6-6"/>
        </svg>
      </button>
    </div>

  </main>

  <div class="modal-overlay" id="changePwdModal">
    <div class="modal-card">
      <h2 data-i18n="changePwd">修改密码</h2>
      <div class="form-group">
        <label data-i18n="oldPwd">原密码</label>
        <input type="password" id="oldPassword" data-i18n-placeholder="oldPwdPh" placeholder="请输入原密码">
      </div>
      <div class="form-group">
        <label data-i18n="newPwd">新密码</label>
        <input type="password" id="newPassword" data-i18n-placeholder="newPwdPh" placeholder="请输入新密码（至少6位）">
      </div>
      <div class="form-group">
        <label data-i18n="confirmPwd">确认新密码</label>
        <input type="password" id="confirmPassword" data-i18n-placeholder="confirmPwdPh" placeholder="请再次输入新密码">
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" id="pwdCancel" data-i18n="cancel">取消</button>
        <button class="btn-confirm" id="pwdConfirm" data-i18n="confirm">确认</button>
      </div>
      <div class="modal-message" id="pwdMessage"></div>
    </div>
  </div>

  <div class="modal-overlay" id="logoutModal">
    <div class="modal-card">
      <h2 data-i18n="logout">退出登录</h2>
      <p class="modal-desc" data-i18n="logoutDesc">确定要退出当前账号吗？</p>
      <div class="modal-actions">
        <button class="btn-cancel" id="logoutCancel" data-i18n="cancel">取消</button>
        <button class="btn-confirm danger" id="logoutConfirm" data-i18n="logoutBtn">退出</button>
      </div>
    </div>
  </div>

  <nav class="tabbar">
    <a href="/quiz" class="tabbar-item">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 6h16M4 12h16M4 18h10"/>
      </svg>
      <span data-i18n="tabQuiz">答题</span>
    </a>
    <a href="/wrong" class="tabbar-item">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 8v5M12 16h.01"/>
        <circle cx="12" cy="12" r="9"/>
      </svg>
      <span data-i18n="tabWrong">错题</span>
    </a>
    <a href="/me" class="tabbar-item active">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 21c0-4 4-7 8-7s8 3 8 7"/>
      </svg>
      <span data-i18n="title">我的</span>
    </a>
  </nav>

  <script src="/static/i18n.js"></script>
  <script src="/static/me.js"></script>
</body>
</html>
